<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Role Levels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#1D7B7F; --pine-d:#155e69; --pine-l:#e7f2f4;
    --royal:#1360A0; --royal-d:#0f4f85; --royal-l:#e9f1f9;
    --navy:#031C2B; --mint:#B0F7CF; --coral:#E66D62;
    --ink:#1B2733; --muted:#5A6B7B; --line:#b9cace; --bg:#f4f6f7; --card:#ffffff;
    --grey:#E6E6DC; --pink:#FBEBEC; --chip:#eef3f4;
    --shadow:0 1px 2px rgba(3,28,43,.06),0 6px 18px rgba(3,28,43,.06);
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Poppins',Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);
       -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{margin:0;font-weight:600;color:var(--navy)}

  /* ===== Excel-style hero banner (royal blue), scrolls away ===== */
  header.stx-hero{background:var(--royal);color:#fff;padding:32px 40px 34px}
  .hero-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:28px}
  .hero-title{font-size:40px;font-weight:700;color:#fff;margin:0;line-height:1.05}
  .hero-sub{font-size:16.5px;color:#fff;opacity:.96;margin:0;max-width:920px;line-height:1.45}
  .hero-logo{height:38px;width:auto;flex:0 0 auto;display:block}

  /* ===== Toolbar sticky at very top (hero scrolls above it) ===== */
  .stx-toolbar{position:sticky;top:0;z-index:35;background:#fff;border-bottom:1px solid var(--line);
    padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  .stx-tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .stx-tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:7px 16px;
    font-size:12.5px;font-weight:500;cursor:pointer;transition:.12s;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .stx-tab:hover{border-color:var(--royal);color:var(--royal)}
  .stx-tab.active{background:var(--royal);border-color:var(--royal);color:#fff}
  .stx-spacer{flex:1 1 auto}
  .stx-search{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:180px}
  .stx-search input{border:0;outline:0;font-family:inherit;font-size:13px;width:100%;background:transparent;color:var(--ink)}
  .stx-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-family:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .stx-btn:hover{color:var(--royal);border-color:var(--royal)}

  .stx-canvas{padding:24px 26px 56px;overflow-x:auto}
  .stx-wrap{max-width:1180px;margin:0 auto}

  /* ===== Excel-style section heading (royal blue, bold) ===== */
  .guide-h{color:var(--royal);font-size:20px;font-weight:700;margin:0 0 10px}
  .guide-p{font-size:13.5px;line-height:1.65;margin:0;max-width:960px;color:var(--ink)}
  .lede{color:var(--muted);font-size:13px;max-width:960px;margin:0 0 16px}
  .block{margin:30px 0 0}
  .block:first-child{margin-top:0}

  /* ===== Data tables (Excel look: royal header band, colour-filled level column) ===== */
  .tbl-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#fff}
  table.stx-tbl{border-collapse:collapse;width:100%;min-width:720px;font-size:12.5px}
  table.stx-tbl th{background:var(--royal);color:#fff;font-weight:600;text-align:left;padding:11px 13px;font-size:11.5px;
    letter-spacing:.3px;vertical-align:bottom}
  table.stx-tbl td{padding:0;border-top:1px solid #e3e9ec;vertical-align:top}
  table.stx-tbl td .pad{padding:10px 13px;display:block;color:var(--ink)}
  td.lvlfill{white-space:nowrap}
  td.lvlfill .pad{font-weight:700;font-size:12px}
  td.lvlfill .gen{display:block;font-weight:500;font-size:10.5px;opacity:.9;margin-top:1px}
  td.rolecell .pad{font-weight:600;color:var(--navy)}
  .yn{display:inline-block;border-radius:5px;padding:1px 8px;font-size:10.5px;font-weight:600}
  .yn.y{background:var(--royal-l);color:var(--royal-d)}
  .yn.n{background:var(--grey);color:var(--muted)}
  .yn.i{background:#fbeef0;color:var(--coral)}
  .align{font-weight:600;color:var(--royal-d)}

  /* ===== Track cards ===== */
  .tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:4px}
  .track{border-radius:var(--radius);padding:15px 17px;color:#fff;box-shadow:var(--shadow)}
  .track .tcode{font-size:12px;font-weight:700;letter-spacing:.5px;opacity:.95}
  .track .tname{font-size:15px;font-weight:600;margin:1px 0 7px}
  .track .tdesc{font-size:12px;line-height:1.5;opacity:.96}
  .note{margin-top:12px;font-size:12px;color:var(--muted);background:var(--royal-l);border-left:3px solid var(--royal);
    border-radius:6px;padding:9px 12px}

  /* ===== Tab nav cards ===== */
  .navgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:6px}
  .stx-navcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--royal);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left}
  .stx-navcard:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(3,28,43,.13);border-color:var(--royal)}
  .stx-navcard .ttl{font-weight:600;font-size:14px;color:var(--royal-d)}
  .stx-navcard .dsc{font-size:12px;color:var(--muted);margin:5px 0 8px}
  .stx-navcard .open{color:var(--royal);font-weight:600;font-size:12px}

  .dim{opacity:.22}
  .hit{outline:2px solid var(--coral);outline-offset:-2px}
  footer.stx-foot{padding:14px 26px 40px;color:var(--muted);font-size:11px;text-align:center}

  @media print{.stx-toolbar{display:none!important}.stx-canvas{overflow:visible}body{background:#fff}}
  @media (max-width:760px){
    header.stx-hero{padding:24px 20px 26px}
    .hero-inner{flex-direction:column;gap:14px}
    .hero-title{font-size:27px}
    .hero-sub{font-size:14px}
    .hero-logo{height:30px;order:-1}
    .guide-h{font-size:18px}
  }
</style>
</head>

const TABS = [
  {id:'guide',    label:'Framework Guide'},
  {id:'overview', label:'Overview'},
  {id:'levelreq', label:'Level Requirements'},
];
let active = 'guide';

const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const codeOf = lvl => (lvl||'').split('–')[0].split('-')[0].trim();
const colorOf = lvl => DATA.colors[codeOf(lvl)] || '#eef3f4';

function textOn(hex){
  const h = hex.replace('#','');
  const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  const L = (0.299*r + 0.587*g + 0.114*b)/255;
  return L > 0.6 ? '#1B2733' : '#ffffff';
}
function yn(v){
  const t=(v||'').toLowerCase();
  if(t.startsWith('y')) return `<span class="yn y">Yes</span>`;
  if(t.startsWith('inf')||t==='informal') return `<span class="yn i">Informal</span>`;
  if(t.startsWith('n')) return `<span class="yn n">No</span>`;
  return esc(v);
}

/* ---------- Tab 1: Framework Guide (matches the Excel cover) ---------- */
function renderGuide(){
  const g = DATA.guide;

  const ladderRows = g.ladder.map(r=>{
    const bg=colorOf(r.level), fg=textOn(bg);
    return `<tr data-search="${esc((r.level+' '+r.role+' '+r.oneline).toLowerCase())}">
      <td class="lvlfill" style="background:${bg}"><span class="pad" style="color:${fg}">${esc(r.level)}</span></td>
      <td class="rolecell"><span class="pad">${esc(r.role)}</span></td>
      <td><span class="pad">${esc(r.oneline)}</span></td>
    </tr>`;
  }).join('');

  const trackBG = {'IC':DATA.colors.IC4||'#1E5A94','M–D':DATA.colors.M4||'#2E9E88','EX':DATA.colors.EX||'#6B4E9E'};
  const tracks = g.tracks.map(t=>`
    <div class="track" style="background:${trackBG[t.code]||'#1360A0'}">
      <div class="tcode">${esc(t.code)}</div>
      <div class="tname">${esc(t.name)}</div>
      <div class="tdesc">${esc(t.desc)}</div>
    </div>`).join('');

  const tabcards = g.tabs.map((t,i)=>{
    const target = i===0 ? 'overview' : 'levelreq';
    return `<div class="stx-navcard" onclick="setTab('${target}')">
      <div class="ttl">${esc(t.name)}</div>
      <div class="dsc">${esc(t.desc)}</div>
      <div class="open">Open ↗</div></div>`;
  }).join('');

  return `
    <div class="block">
      <h2 class="guide-h">What this framework is for</h2>
      <p class="guide-p">${esc(g.purpose)}</p>
    </div>
    <div class="block">
      <h2 class="guide-h">The career ladder at a glance</h2>
      <div class="tbl-wrap"><table class="stx-tbl">
        <thead><tr><th style="min-width:200px">Level</th><th style="min-width:130px">Role</th><th>In one line</th></tr></thead>
        <tbody>${ladderRows}</tbody>
      </table></div>
    </div>
    <div class="block">
      <h2 class="guide-h">Reading the level codes</h2>
      <div class="tracks">${tracks}</div>
    </div>
    <div class="block">
      <h2 class="guide-h">What's in each tab</h2>
      <div class="navgrid">${tabcards}</div>
    </div>`;
}

/* ---------- Tabs 2 & 3: tables ---------- */
function renderTable(obj){
  const rows = obj.rows.map(r=>{
    const lvl=r[0], gen=r[1];
    const bg=colorOf(lvl), fg=textOn(bg);
    const searchKey = r.join(' ').toLowerCase();
    const cells = r.map((c,i)=>{
      if(i===0) return `<td class="lvlfill" style="background:${bg}">
          <span class="pad" style="color:${fg}">${esc(lvl)}<span class="gen">${esc(gen)}</span></span></td>`;
      if(i===1) return '';
      if(/^(Formal People Management|People Leadership)$/.test(obj.headers[i]) && /^(yes|no|informal)/i.test(c))
        return `<td><span class="pad">${yn(c)}</span></td>`;
      if(obj.headers[i]==='Aligns With') return `<td><span class="pad align">${esc(c)}</span></td>`;
      return `<td><span class="pad">${esc(c)}</span></td>`;
    }).join('');
    return `<tr data-search="${esc(searchKey)}">${cells}</tr>`;
  }).join('');
  const headList = obj.headers.map((h,i)=> i===1 ? '' :
    (i===0?`<th style="min-width:200px">${esc(h)} · <span style="opacity:.75;font-weight:400">Generic title</span></th>`
          :`<th>${esc(h)}</th>`)).join('');
  return `
    <div class="block">
      <h2 class="guide-h">${esc(obj.title.split('—').slice(-1)[0].trim())}</h2>
      <p class="lede">${esc(obj.subtitle)}</p>
      <div class="tbl-wrap"><table class="stx-tbl"><thead><tr>${headList}</tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
}

function render(){
  const view=document.getElementById('view');
  if(active==='guide') view.innerHTML=renderGuide();
  else if(active==='overview') view.innerHTML=renderTable(DATA.overview);
  else view.innerHTML=renderTable(DATA.levelreq);
  document.querySelectorAll('.stx-tab').forEach(t=>t.classList.toggle('active', t.dataset.id===active));
  applySearch();
  window.scrollTo({top:0,behavior:'smooth'});
}
function setTab(id){ active=id; render(); }
window.setTab=setTab;

function buildTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="stx-tab" data-id="${t.id}" onclick="setTab('${t.id}')">${esc(t.label)}</button>`).join('');
}

function applySearch(){
  const qel=document.getElementById('q');
  if(!qel) return;
  const q=(qel.value||'').trim().toLowerCase();
  document.querySelectorAll('#view [data-search]').forEach(el=>{
    const hit=!q||(el.dataset.search||'').includes(q);
    el.classList.toggle('hit', !!q&&hit);
    el.classList.toggle('dim', !!q&&!hit);
  });
}
document.getElementById('q')?.addEventListener('input',applySearch);
document.getElementById('printBtn')?.addEventListener('click',()=>window.print());
document.getElementById('foot').textContent = 'For internal use only';

buildTabs();
render();
</script>
